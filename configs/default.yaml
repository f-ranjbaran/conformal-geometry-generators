# Synthetic contour population. See src/cgg/data.py for the generative model.
# Normals below are (mean, standard deviation), matching numpy Generator.normal.
seed: 0
n_shapes: 4000
train_fraction: 0.70
calibration_fraction: 0.15
test_fraction: 0.15
population:
  n_points: 64
  radius_mean: 1.0
  radius_std: 0.05
  amplitude_low: 0.05
  amplitude_high: 0.2
  phase_std: 0.3
  elongation_std: 0.1
  noise_std: 0.01
model:
  # Width 4 matches the four generator factors R, a, phi, and e. c is observed.
  latent_dim: 4
  # Set by the W2 sweep in results/beta_sweep_v2.json. results/beta_sweep.json is the earlier trace-error sweep. results/baseline_collapsed/ is the beta=0.5 run with no warm-up.
  beta: 0.3
train:
  epochs: 100
  batch_size: 128
  lr: 0.001
  # Held out from the train split only. Calibration and test stay untouched.
  val_fraction: 0.15
  # Linear ramp of the KL weight from 0 to beta. Epoch 20 is the first full-beta epoch.
  kl_warmup_epochs: 20
  # Trace-error sweep already saved in results/beta_sweep.json. Not the selection rule anymore.
  beta_candidates: [0.1, 0.03, 0.01, 0.003]
  sweep_c: 0.5
  # Mean 2-Wasserstein over sweep_conditions. One seed per pair.
  beta_candidates_v2: [0.5, 0.3, 0.1, 0.03, 0.01, 0.003, 0.001]
  latent_dim_candidates: [4, 8]
  sweep_conditions: [0.1, 0.5, 0.9]
ensemble:
  seeds: [0, 1, 2, 3, 4]
  samples_per_model: 4096
uncertainty:
  c_min: 0.0
  c_max: 1.0
  c_count: 9
  n_true: 4096
  # Added to both covariances inside the Frechet square root only.
  ridge: 0.0001
  sample_seed: 1000
