# Synthetic contour population. See src/cgg/data.py for the generative model.
# Normals below are (mean, standard deviation), matching numpy Generator.normal.
seed: 0
n_shapes: 4000
train_fraction: 0.70
calibration_fraction: 0.15
test_fraction: 0.15
population:
  n_points: 64
  radius_mean: 1.0
  radius_std: 0.05
  amplitude_low: 0.05
  amplitude_high: 0.2
  phase_std: 0.3
  elongation_std: 0.1
  noise_std: 0.01
model:
  latent_dim: 8
  beta: 0.5
train:
  epochs: 100
  batch_size: 128
  lr: 0.001
  # Held out from the train split only. Calibration and test stay untouched.
  val_fraction: 0.15
ensemble:
  seeds: [0, 1, 2, 3, 4]
  samples_per_model: 4096
uncertainty:
  c_min: 0.0
  c_max: 1.0
  c_count: 9
  n_true: 4096
  # Added to both covariances inside the Frechet square root only.
  ridge: 0.0001
  sample_seed: 1000
